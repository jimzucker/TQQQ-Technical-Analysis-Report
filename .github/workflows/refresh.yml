name: Refresh TQQQ data

# Builds every ticker on docs/data/tickers.json. The workflow keeps its original name so
# the schedule and any links to it stay the same.

on:
  schedule:
    # Six attempts every half hour from 16:15 New York, the earliest point the
    # pipeline will accept a same-day bar (fetch.py treats a session as complete
    # from 16:15). GitHub queues scheduled runs on shared infrastructure and starts
    # them 1-4 hours late in practice, so no single slot is dependable: whichever
    # one first finds a new session publishes it, and the rest exit in about 30
    # seconds without committing. Actions minutes are free on a public repository.
    #
    # Cron is UTC and does not follow daylight saving, so these are anchored to
    # EDT. Summer: 16:15 - 18:45 New York. Winter: 15:15 - 17:45, where the first
    # two land before the close, find nothing and cost ~30s each.
    - cron: "15 20 * * 1-5"   # 16:15 New York (EDT)
    - cron: "45 20 * * 1-5"   # 16:45
    - cron: "15 21 * * 1-5"   # 17:15   <- 16:15 New York in winter (EST)
    - cron: "45 21 * * 1-5"   # 17:45
    - cron: "15 22 * * 1-5"   # 18:15
    - cron: "45 22 * * 1-5"   # 18:45
    # 11:30 UTC Tue-Sat = 7:30 am New York, before the next open. Final backstop if
    # every evening slot was delayed past midnight or dropped altogether.
    - cron: "30 11 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if there is no new session"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Unit tests (Python + JavaScript)
        run: |
          python -m pytest -q pipeline/tests
          node --test tests/*.test.js

      - name: Download, validate and build data
        id: build
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        # Each ticker is built on its own, so one failed download does not stop the others.
        # build.py exits 0 = new data written, 3 = no new session, anything else = failed.
        run: |
          written=""; failed=""
          for sym in $(python -c "import json;print(' '.join(t['symbol'] for t in json.load(open('docs/data/tickers.json'))['tickers']))"); do
            set +e
            python pipeline/build.py --symbol "$sym" ${{ inputs.force && '--force' || '' }}
            code=$?
            set -e
            case "$code" in
              0) written="$written $sym" ;;
              3) echo "$sym: no new session (weekend or market holiday)." ;;
              *) echo "::error::$sym: the build stopped (exit $code); its previous data is kept."; failed="$failed $sym" ;;
            esac
          done
          echo "written=${written# }" >> "$GITHUB_OUTPUT"
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          if [ -n "$written" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Snapshot support levels
        if: steps.build.outputs.changed == 'true'
        run: |
          for sym in ${{ steps.build.outputs.written }}; do node pipeline/snapshot.js --symbol "$sym"; done

      - name: Commit and push
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # "Data refresh: TQQQ, QQQ as of 2026-10-23"; a revision when every ticker written
          # republished a session it had already shipped (the source corrected a bar)
          MSG=$(python - ${{ steps.build.outputs.written }} <<'PY'
          import json, subprocess, sys
          listing = {t["symbol"]: t for t in json.load(open("docs/data/tickers.json"))["tickers"]}
          as_of, revision = [], True
          for sym in sys.argv[1:]:
              path = f"docs/{listing[sym]['dir']}/{sym.lower()}.json"
              now = json.load(open(path))["meta"]["as_of"]
              old = subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, text=True)
              prev = json.loads(old.stdout)["meta"]["as_of"] if old.returncode == 0 else None
              revision = revision and now == prev
              as_of.append(now)
          print(f"Data {'revision' if revision else 'refresh'}: {', '.join(sys.argv[1:])} as of {max(as_of)}")
          PY
          )
          git commit -m "$MSG"
          git push

      - name: Stop the run if any ticker's build stopped
        if: steps.build.outputs.failed != ''
        run: |
          echo "::error::These tickers were not refreshed: ${{ steps.build.outputs.failed }}. The others were published."
          exit 1

      - name: Open an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Daily data refresh failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TODAY=$(date -u +%Y-%m-%d)
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again on $TODAY: $RUN_URL"
          else
            printf 'The scheduled refresh failed on %s. The site keeps showing the last good data.\n\nRun: %s\n' "$TODAY" "$RUN_URL" > body.md
            gh issue create --title "$TITLE" --body-file body.md
          fi
