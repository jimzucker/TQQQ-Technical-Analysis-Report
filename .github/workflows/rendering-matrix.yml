name: Every chart combination

# Draws the main chart in every combination of time frame, Daily/Mondays, light/dark
# and all 256 settings of the 8 chart switches, on a desktop and a phone screen
# (10,240 renders), and checks each one (tests/browser/rendering.spec.js).
# Pull requests run a smaller set of the same checks in tests.yml.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays, 09:00 New York (EDT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Every chart combination
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Draw and check every combination
        env:
          FULL_MATRIX: "1"
        run: npx playwright test tests/browser/rendering.spec.js
      - name: Keep the report when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-matrix-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
