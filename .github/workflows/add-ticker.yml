name: Add a ticker

# Started by the Cloudflare Worker (proxy/worker.mjs) when someone asks for a ticker on the
# page, or by hand from the Actions tab. Adds the ticker to docs/data/tickers.json only if it
# passes the same checks as the nightly refresh, builds its data and 70 sessions of history,
# and commits. The reason is shown on the run's summary page when a ticker is turned away.

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker symbol, e.g. DIA"
        required: true
        type: string

permissions:
  contents: write

# one change to the data at a time: shares the nightly refresh's queue
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: pip install -r pipeline/requirements.txt

      - name: Check the ticker and build its data
        id: add
        env:
          SYMBOL: ${{ inputs.symbol }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          # the symbol comes from a visitor: pass it as an argument, never paste it into the script
          set +e
          python pipeline/add_ticker.py "$SYMBOL" | tee add.txt
          code=${PIPESTATUS[0]}
          set -e
          { echo "### Add a ticker: \`$(printf '%s' "$SYMBOL" | tr -cd 'A-Za-z0-9.-' | head -c 10)\`"; echo; cat add.txt; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "2" ]; then echo "added=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "added=true" >> "$GITHUB_OUTPUT"

      - name: Build its history
        if: steps.add.outputs.added == 'true'
        env:
          SYMBOL: ${{ inputs.symbol }}
        run: node pipeline/snapshot.js --symbol "$SYMBOL" --backfill 70

      - name: Commit and push
        if: steps.add.outputs.added == 'true'
        env:
          SYMBOL: ${{ inputs.symbol }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          SYM=$(printf '%s' "$SYMBOL" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9.-')
          git commit -m "Add ticker: $SYM"
          git push
