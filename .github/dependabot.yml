# Weekly pull requests for newer versions of the Python packages, the npm test
# tooling and the GitHub Actions the workflows use. Minor and patch updates are
# grouped into one pull request per ecosystem; major versions come one at a time.
version: 2
updates:
  - package-ecosystem: pip
    directory: /pipeline
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
